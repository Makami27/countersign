app = "countersign-agent"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  WEB_PORT = "8080"
  DATABASE_PATH = "/data/countersign.sqlite"
  PUBLIC_BASE_URL = "https://countersign-agent.fly.dev"

[mounts]
  source = "countersign_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
